name: CoolLEDX Sign
version: "0.1.6"
slug: coolledx_sign
description: Control a CoolLEDX 16x32 Bluetooth LED sign through an ESPHome Bluetooth proxy.
url: https://github.com/UpDryTwist/coolledx-driver
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_dbus: true
ports:
  8099/tcp: 8099
options:
  proxy_host: ""
  proxy_port: 6053
  noise_psk: ""
  sign_address: ""
  sign_name: CoolLEDX
  log_level: INFO
schema:
  proxy_host: str
  proxy_port: port
  noise_psk: password
  sign_address: str?
  sign_name: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
